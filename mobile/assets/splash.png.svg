<svg width="1284" height="2778" viewBox="0 0 1284 2778" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1284" height="2778" fill="#2563eb"/>

  <!-- Center content -->
  <g transform="translate(242, 1039)">
    <!-- Logo circle -->
    <circle cx="400" cy="350" r="300" fill="#ffffff" opacity="0.1"/>

    <!-- Train -->
    <rect x="200" y="200" width="400" height="500" rx="32" fill="#ffffff"/>

    <!-- Windows -->
    <rect x="240" y="240" width="140" height="140" rx="20" fill="#2563eb"/>
    <rect x="420" y="240" width="140" height="140" rx="20" fill="#2563eb"/>
    <rect x="260" y="260" width="100" height="100" rx="12" fill="#60a5fa"/>
    <rect x="440" y="260" width="100" height="100" rx="12" fill="#60a5fa"/>

    <!-- Train base -->
    <rect x="200" y="520" width="400" height="120" rx="24" fill="#1e40af"/>

    <!-- Wheels -->
    <circle cx="280" cy="600" r="48" fill="#1f2937"/>
    <circle cx="280" cy="600" r="24" fill="#6b7280"/>
    <circle cx="400" cy="600" r="48" fill="#1f2937"/>
    <circle cx="400" cy="600" r="24" fill="#6b7280"/>
    <circle cx="520" cy="600" r="48" fill="#1f2937"/>
    <circle cx="520" cy="600" r="24" fill="#6b7280"/>
  </g>

  <!-- App name -->
  <text x="642" y="1800" font-family="Arial, sans-serif" font-size="96" font-weight="bold" fill="#ffffff" text-anchor="middle">XingAEye</text>

  <!-- Tagline -->
  <text x="642" y="1900" font-family="Arial, sans-serif" font-size="40" fill="#ffffff" opacity="0.8" text-anchor="middle">Railroad Crossing Safety</text>

  <!-- Railroad lines at bottom -->
  <line x1="100" y1="2600" x2="1184" y2="2600" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.3"/>
  <line x1="140" y1="2650" x2="1144" y2="2650" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.3"/>
</svg>
