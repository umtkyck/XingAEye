<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" rx="180" fill="#2563eb"/>

  <!-- Train -->
  <rect x="360" y="320" width="304" height="360" rx="24" fill="#ffffff"/>

  <!-- Windows -->
  <rect x="392" y="352" width="112" height="112" rx="16" fill="#2563eb"/>
  <rect x="520" y="352" width="112" height="112" rx="16" fill="#2563eb"/>
  <rect x="408" y="368" width="80" height="80" rx="8" fill="#60a5fa"/>
  <rect x="536" y="368" width="80" height="80" rx="8" fill="#60a5fa"/>

  <!-- Train base -->
  <rect x="360" y="560" width="304" height="80" rx="16" fill="#1e40af"/>

  <!-- Wheels -->
  <circle cx="424" cy="620" r="32" fill="#1f2937"/>
  <circle cx="424" cy="620" r="16" fill="#6b7280"/>
  <circle cx="512" cy="620" r="32" fill="#1f2937"/>
  <circle cx="512" cy="620" r="16" fill="#6b7280"/>
  <circle cx="600" cy="620" r="32" fill="#1f2937"/>
  <circle cx="600" cy="620" r="16" fill="#6b7280"/>

  <!-- Railroad lines -->
  <line x1="240" y1="720" x2="784" y2="720" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <line x1="280" y1="760" x2="744" y2="760" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

  <!-- Alert badge -->
  <circle cx="864" cy="256" r="128" fill="#ef4444"/>
  <text x="864" y="296" font-family="Arial, sans-serif" font-size="112" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>
</svg>
