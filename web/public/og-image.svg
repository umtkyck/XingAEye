<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1e293b"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Logo -->
  <circle cx="200" cy="315" r="80" fill="#2563eb"/>
  <rect x="160" y="275" width="80" height="80" rx="8" fill="#ffffff"/>
  <rect x="168" y="283" width="28" height="28" rx="4" fill="#2563eb"/>
  <rect x="196" y="283" width="28" height="28" rx="4" fill="#2563eb"/>
  <rect x="172" y="287" width="20" height="20" rx="2" fill="#60a5fa"/>
  <rect x="200" y="287" width="20" height="20" rx="2" fill="#60a5fa"/>
  <rect x="160" y="330" width="80" height="20" rx="4" fill="#1e40af"/>
  <circle cx="176" cy="340" r="8" fill="#1f2937"/>
  <circle cx="200" cy="340" r="8" fill="#1f2937"/>
  <circle cx="224" cy="340" r="8" fill="#1f2937"/>

  <!-- Alert indicator -->
  <circle cx="260" cy="270" r="28" fill="#ef4444"/>
  <text x="260" y="285" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>

  <!-- Title -->
  <text x="340" y="280" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">XingAEye</text>

  <!-- Subtitle -->
  <text x="340" y="340" font-family="Arial, sans-serif" font-size="36" fill="#94a3b8">Railroad Crossing Safety System</text>

  <!-- Features -->
  <text x="340" y="400" font-family="Arial, sans-serif" font-size="24" fill="#64748b">🤖 AI-Powered Detection</text>
  <text x="340" y="440" font-family="Arial, sans-serif" font-size="24" fill="#64748b">📹 Real-time Monitoring</text>
  <text x="340" y="480" font-family="Arial, sans-serif" font-size="24" fill="#64748b">🚨 Instant Alerts</text>

  <!-- Railroad lines -->
  <line x1="50" y1="580" x2="1150" y2="580" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <line x1="70" y1="600" x2="1130" y2="600" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
</svg>
