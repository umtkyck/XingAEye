<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="#2563eb"/>

  <!-- Train -->
  <rect x="62" y="55" width="56" height="70" rx="6" fill="#ffffff"/>

  <!-- Windows -->
  <rect x="69" y="62" width="20" height="20" rx="3" fill="#2563eb"/>
  <rect x="91" y="62" width="20" height="20" rx="3" fill="#2563eb"/>
  <rect x="72" y="65" width="14" height="14" rx="2" fill="#60a5fa"/>
  <rect x="94" y="65" width="14" height="14" rx="2" fill="#60a5fa"/>

  <!-- Train base -->
  <rect x="62" y="105" width="56" height="15" rx="4" fill="#1e40af"/>

  <!-- Wheels -->
  <circle cx="76" cy="114" r="6" fill="#1f2937"/>
  <circle cx="76" cy="114" r="3" fill="#6b7280"/>
  <circle cx="90" cy="114" r="6" fill="#1f2937"/>
  <circle cx="90" cy="114" r="3" fill="#6b7280"/>
  <circle cx="104" cy="114" r="6" fill="#1f2937"/>
  <circle cx="104" cy="114" r="3" fill="#6b7280"/>

  <!-- Railroad lines -->
  <line x1="40" y1="145" x2="140" y2="145" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="45" y1="155" x2="135" y2="155" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Alert badge -->
  <circle cx="140" cy="40" r="24" fill="#ef4444"/>
  <text x="140" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>
</svg>
